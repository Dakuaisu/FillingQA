name: eval

# PRD 11.5 eval gate. Runs the fast subset on anthropic_api and enforces
# eval/thresholds.yaml through eval/compare.py. Without ANTHROPIC_API_KEY the job
# FAILS with that reason; it never skips or passes (F-59). The frozen corpus comes
# from the snapshot archive released as corpus-snapshot-<sha12> (F-135).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: filingqa
          POSTGRES_PASSWORD: filingqa
          POSTGRES_DB: filingqa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filingqa" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://filingqa:filingqa@localhost:5432/filingqa
      FILINGQA_GENERATION_BACKEND: anthropic_api
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require ANTHROPIC_API_KEY
        run: |
          mkdir -p build
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            printf '### Eval gate: FAILED\n\nANTHROPIC_API_KEY is not set on this runner; the eval cannot run and the gate does not pass (F-59).\n' > build/eval_gate.md
            echo "::error::ANTHROPIC_API_KEY is not set; the eval gate cannot run (F-59)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrate
        run: make migrate

      - name: Restore corpus snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PG_EXEC: docker exec -i ${{ job.services.postgres.id }}
        run: |
          sha=$(python -c "import yaml;print(yaml.safe_load(open('api/corpus_freeze.yaml'))['snapshot']['sha256'])")
          tag="corpus-snapshot-${sha:0:12}"
          gh release download "$tag" --pattern corpus_snapshot.dump --dir build || {
            printf '### Eval gate: FAILED\n\nCorpus snapshot release %s is not hosted (F-135).\n' "$tag" > build/eval_gate.md
            echo "::error::corpus snapshot $tag not hosted (F-135)"
            exit 1
          }
          make restore-corpus-snapshot

      - name: Fast eval and gate
        env:
          VERIFY_FLAGS: --snapshot
        run: make eval-fast

      - name: Comment the gate on the PR
        if: always() && hashFiles('build/eval_gate.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('build/eval_gate.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
