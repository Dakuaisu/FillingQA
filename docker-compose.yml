# Phase 1: Postgres only. redis, api, worker and langfuse arrive in later phases
# (PRD 13.2) -- do not add them ahead of the phase that uses them.
#
# Development runs against this container. PRD 13.2 says pg16; the project
# moved to pg18 and the pinned version follows it.

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: filingqa
      POSTGRES_PASSWORD: filingqa
      POSTGRES_DB: filingqa
    ports:
      - "5432:5432"
    volumes:
      # pg18+ images refuse to start with a mount at .../postgresql/data; they
      # keep data in a major-version subdirectory under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filingqa -d filingqa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
