# Corpus definition. PRD 4.4 and Appendix A.
#
# NOTE ON `sector`: these four labels are OURS, not SEC's. PRD 4.4 picked eight
# companies across four sectors with two deliberately confusable pairs
# (COST/TGT, JPM/BAC) to exercise entity bleed. SIC codes do not map cleanly
# onto those four buckets -- SIC is a much finer taxonomy built for a different
# purpose -- so the bucket is recorded here as corpus-design metadata rather
# than derived from SEC data. `companies.sic_code` carries SEC's own value
# alongside it, unmodified.

corpus:
  form_types: [10-K, 10-Q]
  years_back: 3

  companies:
    - ticker: COST
      sector: retail        # retail pair #1 -- near-identical line items to TGT
    - ticker: TGT
      sector: retail        # retail pair #2 -- the entity-bleed test lives here
    - ticker: JPM
      sector: financials    # bank pair #1
    - ticker: BAC
      sector: financials    # bank pair #2
    - ticker: AAPL
      sector: tech          # clean, well-structured filing; parser baseline
    - ticker: NVDA
      sector: tech          # rapid YoY changes sharpen comparison questions
    - ticker: XOM
      sector: energy        # segment tables and unusual units
    # PRD 4.4 says "Sectors | 4 (tech, retail, energy, financials)" but its own
    # company table describes PFE as "Pharma". Five labels, not four. Left as
    # `pharma` because the company table is the more specific statement and
    # because folding pharma into any of the other four would be arbitrary.
    # Nothing consumes `sector` yet, so this is cheap to change -- flag if you
    # want PFE bucketed into one of the four instead.
    - ticker: PFE
      sector: pharma        # dense footnotes and complex risk-factor prose

  # The parser-development slice. NOT an eval corpus -- see docs/TRADEOFFS.md.
  #
  # An explicit accession list, never a window relative to today: a window
  # makes the corpus a function of the run date, which breaks PRD 11.4. Ingest
  # fails if any accession is missing from the company's submissions; it never
  # substitutes a nearby filing. `form` is checked against SEC's own value.
  dev_slice:
    - {ticker: AAPL, accession: 0000320193-25-000079, form: 10-K}
    - {ticker: AAPL, accession: 0000320193-26-000006, form: 10-Q}
    - {ticker: AAPL, accession: 0000320193-26-000013, form: 10-Q}
    - {ticker: AAPL, accession: 0000320193-26-000020, form: 10-Q}
    - {ticker: COST, accession: 0000909832-25-000101, form: 10-K}
    - {ticker: COST, accession: 0000909832-25-000169, form: 10-Q}
    - {ticker: COST, accession: 0000909832-26-000029, form: 10-Q}
    - {ticker: COST, accession: 0000909832-26-000051, form: 10-Q}
    - {ticker: TGT, accession: 0000027419-25-000126, form: 10-Q}
    - {ticker: TGT, accession: 0000027419-26-000016, form: 10-K}
    - {ticker: TGT, accession: 0000027419-26-000022, form: 10-Q}
    - {ticker: TGT, accession: 0000027419-26-000042, form: 10-Q}

# Parser validation bounds (PRD 6.2's validation suite). Pipeline parameters in
# the pattern of PRD Appendix A, not eval-gate thresholds -- those live in
# eval/thresholds.yaml. See docs/OPEN.md F-23.
parser:
  min_sections: 5
  min_data_tables: 10       # data tables, not layout scaffolding (F-35)
  alpha_ratio:              # letters / all characters of the normalized text
    min: 0.4
    max: 0.95

# Chunking (PRD 6.3, Appendix A). Pipeline parameters, like `parser:` (F-23).
chunking:
  # The floor of PRD 6.3's 500-800 range, inside the embedding model's limit
  # (F-53). Counts the whole embedded text, context header included.
  target_tokens: 500
  overlap_pct: 0.15
  # A non-data block whose digit-normalized text repeats this many times in one
  # filing, and does not end like a sentence, is page furniture (PRD 6.2 step 4).
  furniture_min_repeats: 5

# The embedding model (PRD 6.4), pinned so token counts here equal the sequence
# length sentence-transformers will see. The tokenizer file is vendored at
# api/chunk/ so counting is offline and reproducible; its sha is checked on load.
embedding:
  model: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  max_seq_length: 512
  dim: 768                 # chunks.embedding and embedding_cache are VECTOR(768)
  batch_size: 64
  tokenizer_file: api/chunk/bge-base-en-v1.5.tokenizer.json
  tokenizer_sha256: d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66

# PRD 14 Phase 2: "assert >=80% resolve". A floor on span-to-chunk resolution;
# well below it means offsets did not survive parsing and Phase 1 needs fixing.
span_resolution:
  min_rate: 0.80
