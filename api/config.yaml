# Parser validation bounds (PRD 6.2's validation suite). Pipeline parameters in
# the pattern of PRD Appendix A, not eval-gate thresholds -- those live in
# eval/thresholds.yaml. See docs/OPEN.md F-23.
parser:
  min_sections: 5
  min_data_tables: 10       # data tables, not layout scaffolding (F-35)
  # A required Item at or below this length is a cross-reference stub: it points
  # elsewhere instead of holding content. 10-K Items 1, 1A, 7 and 10-Q Items I.1,
  # I.2 must not be stubs -- every Item 7 stub in the corpus (JPM, XOM) has its
  # content outside the Item structure. 10-K Items 7A and 8 may be: a 7A pointing
  # into Item 7, or an 8 pointing to Item 15, leaves the content under the label
  # the filer gave it (F-69). Set after measuring all 96 filings on 2026-10-01:
  # no Item that must not be a stub lies between 500 and 5,000 chars (WORKLOG).
  stub_max_chars: 1000
  alpha_ratio:              # letters / all characters of the normalized text
    min: 0.4
    max: 0.95

# Chunking (PRD 6.3, Appendix A). Pipeline parameters, like `parser:` (F-23).
chunking:
  # The floor of PRD 6.3's 500-800 range, inside the embedding model's limit
  # (F-53). Counts the whole embedded text, context header included.
  target_tokens: 500
  overlap_pct: 0.15
  # A non-data block whose digit-normalized text repeats this many times in one
  # filing, and does not end like a sentence, is page furniture (PRD 6.2 step 4).
  furniture_min_repeats: 5

# The embedding model (PRD 6.4), pinned so token counts here equal the sequence
# length sentence-transformers will see. The tokenizer file is vendored at
# api/chunk/ so counting is offline and reproducible; its sha is checked on load.
embedding:
  model: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  max_seq_length: 512
  dim: 768                 # chunks.embedding and embedding_cache are VECTOR(768)
  batch_size: 64
  tokenizer_file: api/chunk/bge-base-en-v1.5.tokenizer.json
  tokenizer_sha256: d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66

# PRD 14 Phase 2: "assert >=80% resolve". A floor on span-to-chunk resolution;
# well below it means offsets did not survive parsing and Phase 1 needs fixing.
# Hybrid retrieval (PRD 7.2, Appendix A): dense and sparse top-50 fused by
# weighted Reciprocal Rank Fusion; the fused list is the pre-rerank list (F-13).
retrieval:
  k_dense: 50
  k_sparse: 50
  rrf_k: 60
  weights: { dense: 1.0, sparse: 1.0 }

span_resolution:
  min_rate: 0.80

# Phase 2 naive baseline (PRD 14): dense-only, top-k, unstructured generation.
# `top_k` is the number of chunks handed to the generator -- not
# `retrieval.k_dense`, which is the hybrid candidate pool of Phase 4.
baseline:
  top_k: 5

# PRD Appendix A. Provider Anthropic (PRD 12's CI config carries only
# ANTHROPIC_API_KEY). The baseline uses tier_small.
generation:
  tier_small: claude-haiku-4-5-20251001
  tier_large: claude-sonnet-5-5
  # No `temperature`: the Messages API at anthropic==1.11.0 takes no sampling
  # parameters, so Appendix A's 0.0 cannot be applied (F-60). A key here that
  # is not sent would claim a setting the run does not have.
  max_tokens: 1024        # the Messages API requires a cap; not in Appendix A
  # claude_cli answers are dev-only: never README, CI baseline, or compared with anthropic_api.
  backend: claude_cli       # claude_cli | anthropic_api
  cli_system_prompt: "You are a helpful assistant."

# xbrl_auto sampler (PRD 11.1: 160 `xbrl_numeric` items). Equal allocation per
# ticker, no backfill across tickers (TRADEOFFS, sampler design). The seed is
# recorded with the dataset.
eval_sampler:
  seed: 20261001
  total: 160
  per_ticker:
    COST: 20
    TGT: 20
    JPM: 20
    BAC: 20
    AAPL: 20
    NVDA: 20
    XOM: 20
    PFE: 20
  # xbrl_numeric candidates (scripts/xbrl_candidates.py). Not a golden_* file.
  dataset_version: xbrl_candidates_v1
  spot_check_n: 16          # PRD 11.1: spot-check 10% of XBRL items

# xbrl_auto comparison candidates (PRD 11.1 comparison row, Stage 3; TRADEOFFS).
# Seed fixed before the first draw; no re-draw after seeing it.
eval_comparison:
  seed: 20261002
  total: 40
  per_ticker:
    COST: 5
    TGT: 5
    JPM: 5
    BAC: 5
    AAPL: 5
    NVDA: 5
    XOM: 5
    PFE: 5
  gaps: [1, 2]              # fiscal years between the two sides
  dataset_version: comparison_candidates_v1
  spot_check_n: 4           # PRD 11.1: 10%

# LLM seeding (PRD 11.1 Stage 1/2; TRADEOFFS, LLM seeding). Seeds fixed before
# the first draw; one draw, no re-draw. `per_ticker` for tables: 6 each plus one
# for the two tickers picked by `pick_extra(tickers, seed, 2)` (AAPL, XOM).
eval_seeding:
  table:
    seed: 20261003
    total: 50
    per_ticker:
      COST: 6
      TGT: 6
      JPM: 6
      BAC: 6
      AAPL: 7
      NVDA: 6
      XOM: 7
      PFE: 6
    overdraw: 2             # chunks seeded per slot
  synthesis:
    seed: 20261004
    total: 40
    per_ticker:
      COST: 5
      TGT: 5
      JPM: 5
      BAC: 5
      AAPL: 5
      NVDA: 5
      XOM: 5
      PFE: 5
    overdraw: 2
    min_body_tokens: 40     # body tokens, header excluded (TRADEOFFS: seeding scale, floor, prompt)
