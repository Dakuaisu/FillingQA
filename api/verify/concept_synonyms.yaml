# Hand-written synonym map for the curated line items (PRD 6.5.4), read by
# api/verify/xbrl_check.py together with eval/concepts.yaml (labels, tags,
# variants). Keys are line-item ids from eval/concepts.yaml; matching is on the
# normalized phrase (lowercase, punctuation and "total"/"net" kept as written).
revenue: [revenue, revenues, total revenue, total revenues, net sales, total net sales, net revenue, net revenues]
cost_of_revenue: [cost of revenue, cost of revenues, cost of sales, total cost of sales, cost of goods sold]
gross_profit: [gross profit, gross margin]
operating_income: [operating income, income from operations, operating income (loss)]
net_income: [net income, net earnings, net income (loss)]
research_and_development: [research and development, research and development expense, r&d expense]
sga: [selling general and administrative, selling general and administrative expense, sg&a]
eps_diluted: [diluted eps, diluted earnings per share, earnings per share diluted, diluted net income per share]
total_assets: [total assets, assets]
current_assets: [total current assets, current assets]
total_liabilities: [total liabilities, liabilities]
stockholders_equity: [total stockholders equity, stockholders equity, shareholders equity, total shareholders equity]
cash_and_equivalents: [cash and cash equivalents]
inventory: [inventories, inventory]
accounts_receivable: [accounts receivable net, accounts receivable]
long_term_debt_noncurrent: [long-term debt, long term debt, long-term debt noncurrent, long-term debt excluding current portion]
operating_cash_flow: [net cash provided by operating activities, operating cash flow, cash from operations]
capex: [payments for property plant and equipment, capital expenditures, capex, purchases of property and equipment]
share_repurchases: [payments for repurchases of common stock, share repurchases, repurchases of common stock, stock repurchases]
net_interest_income: [net interest income]
noninterest_income: [noninterest income, non-interest income, total noninterest income]
noninterest_expense: [noninterest expense, non-interest expense, total noninterest expense]
credit_loss_allowance: [allowance for credit losses, allowance for credit losses on loans, allowance for loan losses]
deposits: [total deposits, deposits]
pretax_income: [income before income taxes, pretax income, income before taxes, earnings before income taxes]
income_tax: [income tax expense, provision for income taxes, income taxes]
